<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理画面</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f6f8; font-size: 14px; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f1f3f5; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-primary { background: #007BFF; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .status { margin-bottom: 10px; font-weight: bold; color: #333; min-height: 20px; }
        .record-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>登録者一覧管理</h2>
        <div class="status" id="status-msg"></div>
        <div style="margin-bottom: 10px; display: flex; gap: 10px;">
            <button class="btn-primary" onclick="loadUsers()">手動更新</button>
            <button class="btn-success" onclick="showDetails()">選択ユーザーの詳細（複数可）</button>
            <button class="btn-danger" onclick="deleteSelected()">選択項目を削除</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>選択</th>
                    <th>名前</th>
                    <th>PIN</th>
                    <th>登録日時</th>
                </tr>
            </thead>
            <tbody id="user-tbody"></tbody>
        </table>
    </div>

    <div class="card" id="detail-card" style="display:none;">
        <h3 id="detail-title">選択ユーザーの記録詳細</h3>
        <div id="detail-content"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyjTfqXz6mQQpE11uuimNDBUPG1o-fku3KsrCeaCO0icgiCk0yxKRg2iMW9WD5wUTNI/exec";

        async function loadUsers() {
            document.getElementById('status-msg').innerText = "読み込み中...";
            const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
            const users = await res.json();
            const tbody = document.getElementById('user-tbody');
            tbody.innerHTML = '';

            users.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td><input type="checkbox" class="row-checkbox" value="${u.row}" data-name="${u.name}"></td>
                        <td>${u.name}</td>
                        <td>${u.pin}</td>
                        <td>${u.date}</td>
                    </tr>
                `;
            });
            document.getElementById('status-msg').innerText = "最新データを読み込みました";
        }

        async function showDetails() {
            const checked = document.querySelectorAll('.row-checkbox:checked');
            if (checked.length === 0) {
                document.getElementById('status-msg').innerText = "詳細を見るユーザーを1名以上選択してください";
                return;
            }
            
            const names = Array.from(checked).map(cb => cb.getAttribute('data-name')).join(',');
            document.getElementById('status-msg').innerText = "選択されたユーザーの詳細データを読み込み中...";
            
            const res = await fetch(`${GAS_URL}?action=getMultipleRecords&names=${encodeURIComponent(names)}&t=${new Date().getTime()}`);
            const records = await res.json();
            
            const detailCard = document.getElementById('detail-card');
            const detailContent = document.getElementById('detail-content');
            
            if (!records || records.length === 0) {
                detailContent.innerHTML = "<p>選択されたユーザーの記録データがまだありません。</p>";
            } else {
                let html = "";
                records.forEach(rec => {
                    html += `<div class="record-box"><table>`;
                    // 名前・日付・更新日時を先に表示
                    html += `<tr><th style="width:30%; background:#e2e8f0;">名前</th><td><b>${rec["名前"]}</b></td></tr>`;
                    html += `<tr><th style="background:#e2e8f0;">記録日</th><td><b>${rec["日付"]}</b></td></tr>`;
                    html += `<tr><th style="background:#e2e8f0;">登録日時(更新)</th><td>${rec["更新日時"]}</td></tr>`;
                    
                    for (let key in rec) {
                        if (key !== "名前" && key !== "日付" && key !== "更新日時") {
                            html += `<tr><th>${key}</th><td>${rec[key]}</td></tr>`;
                        }
                    }
                    html += `</table></div>`;
                });
                detailContent.innerHTML = html;
            }
            detailCard.style.display = "block";
            document.getElementById('status-msg').innerText = "詳細を表示しました";
        }

        async function deleteSelected() {
            const checked = document.querySelectorAll('.row-checkbox:checked');
            if (checked.length === 0) {
                document.getElementById('status-msg').innerText = "削除する項目が選択されていません";
                return;
            }

            const rows = Array.from(checked).map(cb => parseInt(cb.value));
            document.getElementById('status-msg').innerText = "削除処理中...";

            await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'delete', rows: rows }) 
            });

            document.getElementById('status-msg').innerText = "選択項目を削除しました";
            document.getElementById('detail-card').style.display = "none";
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
