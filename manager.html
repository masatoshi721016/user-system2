<!DOCTYPE html>
<html>
<head><style>body{padding:10px;} table{border-collapse:collapse; width:100%;} th,td{border:1px solid #ccc; padding:5px; font-size:12px; white-space:nowrap;}</style></head>
<body>
    <h2>管理一覧</h2>
    <div style="overflow-x:auto;">
        <table id="recordTable">
            <thead>
                <tr><th>名前</th><th>体調</th><th>服薬(朝昼夕寝)</th><th>食事(朝昼夕)</th><th>就寝</th><th>起床</th><th>体温</th><th>特記事項</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        const URL = "ここにGASのウェブアプリURL";
        async function load() {
            const res = await fetch(URL + "?action=getRecords");
            const data = await res.json();
            const tbody = document.querySelector('#recordTable tbody');
            data.forEach(r => {
                tbody.innerHTML += `<tr><td>${r.name}</td><td>${r.体調}</td>
                <td>${r.服薬今朝}/${r.服薬昨昼}/${r.服薬昨夕}/${r.服薬就寝前}</td>
                <td>${r.食事今朝}/${r.食事昨昼}/${r.食事昨夕}</td>
                <td>${r.昨夜就寝時間}</td><td>${r.本日起床時間}</td><td>${r.体温}</td><td>${r.特記事項}</td></tr>`;
            });
        }
        load();
    </script>
</body>
</html>
