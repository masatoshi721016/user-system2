<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 10px; max-width: 1000px; margin: 0 auto; background: #f4f6f8; font-size: 14px; }
        h2 { font-size: 20px; text-align: center; margin-bottom: 10px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .action-btn { flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .update-btn { background: #007BFF; color: white; }
        .info-btn { background: #17a2b8; color: white; }
        .delete-btn { background: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 6px 4px; text-align: center; font-size: 13px; }
        th { background: #f1f3f5; }
        .view { display: none; }
        .view.active { display: block; }
        .back-btn { background: #6c757d; color: white; margin-bottom: 10px; padding: 6px 12px; }
    </style>
</head>
<body>
    <div id="view-list" class="card view active">
        <h2>登録者一覧</h2>
        <div class="btn-group">
            <button class="action-btn update-btn" onclick="loadUsers()">更新</button>
            <button class="action-btn info-btn" onclick="goToUserInfo()">情報表示</button>
            <button class="action-btn delete-btn" onclick="deleteSelected()">削除</button>
        </div>
        <table id="user-table">
            <thead><tr><th><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th><th>名前</th><th>PIN</th><th>登録日時</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="view-info" class="card view">
        <button class="action-btn back-btn" onclick="showListView()">← 戻る</button>
        <h2 id="info-title">ユーザー詳細</h2>
        <table id="record-table">
            <thead><tr><th>名前</th><th>出勤</th><th>休憩入り</th><th>休憩戻り</th><th>退勤</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec";
        
        async function loadUsers() {
            const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
            const data = await res.json();
            const tbody = document.querySelector('#user-table tbody');
            tbody.innerHTML = '';
            (Array.isArray(data) ? data : (data.users || [])).forEach(user => {
                tbody.innerHTML += `<tr><td><input type="checkbox" class="row-checkbox" value="${user.row}" data-name="${user.name}"></td><td>${user.name}</td><td>${user.pin}</td><td>${user.date}</td></tr>`;
            });
        }

        function toggleSelectAll(master) { document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = master.checked); }

        async function goToUserInfo() {
            const checked = document.querySelectorAll('.row-checkbox:checked');
            if (checked.length === 0) return alert("ユーザーを選択してください");
            const names = Array.from(checked).map(cb => cb.getAttribute('data-name'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-info').classList.add('active');
            
            const res = await fetch(GAS_URL + '?names=' + encodeURIComponent(names.join(',')));
            const data = await res.json();
            const tbody = document.querySelector('#record-table tbody');
            tbody.innerHTML = '';

            const summary = {};
            names.forEach(n => summary[n] = { 出勤: '-', 休憩入り: '-', 休憩戻り: '-', 退勤: '-' });
            (data.records || []).forEach(r => { if(summary[r.name]) summary[r.name][r.item] = r.dateTime; });

            names.forEach(n => {
                tbody.innerHTML += `<tr><td><b>${n}</b></td><td>${summary[n].出勤}</td><td>${summary[n].休憩入り}</td><td>${summary[n].休憩戻り}</td><td>${summary[n].退勤}</td></tr>`;
            });
        }

        function showListView() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-list').classList.add('active');
        }

        async function deleteSelected() {
            const checked = document.querySelectorAll('.row-checkbox:checked');
            if (checked.length === 0) return;
            const rows = Array.from(checked).map(cb => parseInt(cb.value));
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', rows: rows }) });
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
