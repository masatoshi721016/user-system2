<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            background: #f9f9f9; 
            font-size: 20px; 
        }
        h2 { font-size: 28px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: center; font-size: 18px; }
        th { background: #007BFF; color: white; }
        button.delete-btn { 
            background: #dc3545; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 16px; 
        }
        button.delete-btn:hover { background: #c82333; }
        .status-msg { text-align: center; font-size: 18px; color: #666; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>登録者一覧（管理画面）</h2>
        <div id="manager-status" class="status-msg"></div>
        <table id="user-table">
            <thead>
                <tr>
                    <th>名前</th>
                    <th>PIN</th>
                    <th>登録日時</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec";

        async function loadUsers() {
            const statusEl = document.getElementById('manager-status');
            statusEl.innerText = "読み込み中…";
            try {
                const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
                const data = await res.json();
                const tbody = document.querySelector('#user-table tbody');
                tbody.innerHTML = '';
                
                data.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.name}</td>
                        <td>${user.pin}</td>
                        <td>${user.date || ''}</td>
                        <td><button class="delete-btn" onclick="deleteUser(${user.row})">削除</button></td>
                    `;
                    tbody.appendChild(tr);
                });
                statusEl.innerText = "";
            } catch (e) {
                statusEl.innerText = "データの読み込みに失敗しました";
            }
        }

        async function deleteUser(row) {
            const statusEl = document.getElementById('manager-status');
            statusEl.innerText = "削除中…";

            try {
                await fetch(GAS_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'delete', row: row }) 
                });

                // ポップを出さず、画面上の表示メッセージで処理し、1秒後に一覧を自動更新
                setTimeout(() => {
                    statusEl.innerText = "";
                    loadUsers();
                }, 1000);
            } catch (e) {
                statusEl.innerText = "削除に失敗しました";
            }
        }

        loadUsers();
    </script>
</body>
</html>
