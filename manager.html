<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            padding: 20px; 
            max-width: 650px; 
            margin: 0 auto; 
            background: #f9f9f9; 
            font-size: 20px; 
        }
        h2 { font-size: 28px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            font-family: inherit; 
        }
        .update-btn { background: #007BFF; color: white; }
        .update-btn:hover { background: #0056b3; }
        .delete-btn { background: #dc3545; color: white; }
        .delete-btn:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: center; font-size: 18px; }
        th { background: #333; color: white; }
        .status-msg { text-align: center; font-size: 18px; color: #666; margin-bottom: 10px; font-weight: bold; }
        input[type="checkbox"] { transform: scale(1.4); cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>登録者一覧（管理画面）</h2>
        <div id="manager-status" class="status-msg"></div>
        
        <div class="btn-group">
            <button class="action-btn update-btn" onclick="loadUsers()">手動更新</button>
            <button class="action-btn delete-btn" onclick="deleteSelected()">選択した項目を削除</button>
        </div>

        <table id="user-table">
            <thead>
                <tr>
                    <th style="width: 50px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
                    <th>名前</th>
                    <th>PIN</th>
                    <th>登録日時</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec";

        async function loadUsers() {
            const statusEl = document.getElementById('manager-status');
            statusEl.innerText = "読み込み中…";
            try {
                // キャッシュを完全に回避するためのタイムスタンプ＋ランダム値
                const res = await fetch(GAS_URL + '?t=' + new Date().getTime() + '&r=' + Math.random());
                const data = await res.json();
                const tbody = document.querySelector('#user-table tbody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    statusEl.innerText = "登録されているデータはありません";
                    return;
                }

                data.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="checkbox" class="row-checkbox" value="${user.row}"></td>
                        <td>${user.name}</td>
                        <td>${user.pin}</td>
                        <td>${user.date || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
                statusEl.innerText = "";
            } catch (e) {
                statusEl.innerText = "データの読み込みに失敗しました";
            }
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        async function deleteSelected() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length === 0) {
                document.getElementById('manager-status').innerText = "削除する項目が選択されていません";
                return;
            }

            const rows = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
            const statusEl = document.getElementById('manager-status');
            statusEl.innerText = "削除中…";

            try {
                await fetch(GAS_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'delete', rows: rows }) 
                });

                // ポップを出さず、メッセージ表示後に自動で最新状態を再読み込み
                setTimeout(() => {
                    statusEl.innerText = "";
                    document.getElementById('select-all').checked = false;
                    loadUsers();
                }, 1000);
            } catch (e) {
                statusEl.innerText = "削除に失敗しました";
            }
        }

        // ページを開いた時に自動読み込み
        loadUsers();
    </script>
</body>
</html>
