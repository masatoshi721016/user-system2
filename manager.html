<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理画面</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f6f8; font-size: 14px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; white-space: nowrap; }
        th { background: #f1f3f5; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-primary { background: #007BFF; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .status { margin-bottom: 10px; font-weight: bold; color: #333; min-height: 20px; }
        .page { display: none; }
        .page.active { display: block; }
        .table-container { overflow-x: auto; margin-bottom: 20px; }
        .badge-deleted { background: #dc3545; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 8px; vertical-align: middle; }
        .row-deleted { background: #fdf2f2; color: #666; }
        .auto-refresh-notice { font-size: 12px; color: #666; margin-left: 10px; font-weight: normal; }
        
        /* 選択枠いっぱいの正方形ボタン */
        .select-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
            color: #64748b;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }
        .select-btn.selected {
            background: #2563eb;
            border-color: #1d4ed8;
            color: white;
        }
        .select-btn:hover {
            border-color: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- 一覧ページ -->
    <div id="page-list" class="page active">
        <div class="card">
            <h2>登録者一覧管理 <span class="auto-refresh-notice">（※15秒ごとに自動更新されます）</span></h2>
            <div class="status" id="status-msg"></div>
            <div style="margin-bottom: 10px; display: flex; gap: 10px;">
                <button class="btn-primary" onclick="loadUsers()">手動更新</button>
                <button class="btn-success" onclick="showDetailsPage()">選択ユーザーの詳細表示</button>
                <button class="btn-danger" onclick="deleteSelected()">選択項目を削除</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">選択</th>
                        <th>名前</th>
                        <th>PIN</th>
                        <th>登録日時</th>
                    </tr>
                </thead>
                <tbody id="user-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 詳細ページ -->
    <div id="page-detail" class="page">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">選択ユーザーの記録詳細</h2>
                <button class="btn-secondary" onclick="backToList()">← 一覧に戻る</button>
            </div>
            <div id="detail-content"></div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyjTfqXz6mQQpE11uuimNDBUPG1o-fku3KsrCeaCO0icgiCk0yxKRg2iMW9WD5wUTNI/exec";

        async function loadUsers(isAuto = false) {
            if (!isAuto) {
                document.getElementById('status-msg').innerText = "読み込み中...";
            }
            const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
            const users = await res.json();
            const tbody = document.getElementById('user-tbody');
            
            const selectedNames = Array.from(document.querySelectorAll('.select-btn.selected')).map(btn => btn.getAttribute('data-name'));

            tbody.innerHTML = '';

            users.forEach(u => {
                const isDeleted = (u.status === "削除済み");
                const badge = isDeleted ? `<span class="badge-deleted">削除済み</span>` : "";
                const rowClass = isDeleted ? `class="row-deleted"` : "";
                const isSelected = selectedNames.includes(u.name);
                
                const btnClass = isSelected ? "select-btn selected" : "select-btn";
                const btnText = isSelected ? "選択中" : "選択";

                tbody.innerHTML += `
                    <tr ${rowClass}>
                        <td style="padding: 4px;">
                            <button class="${btnClass}" data-row="${u.row}" data-name="${u.name}" onclick="toggleSelect(this)">${btnText}</button>
                        </td>
                        <td>${u.name} ${badge}</td>
                        <td>${u.pin}</td>
                        <td>${u.date}</td>
                    </tr>
                `;
            });
            document.getElementById('status-msg').innerText = isAuto ? "最新データを自動更新しました" : "最新データを読み込みました";
        }

        function toggleSelect(btn) {
            btn.classList.toggle('selected');
            if (btn.classList.contains('selected')) {
                btn.innerText = "選択中";
            } else {
                btn.innerText = "選択";
            }
        }

        async function showDetailsPage() {
            const selectedBtns = document.querySelectorAll('.select-btn.selected');
            if (selectedBtns.length === 0) {
                document.getElementById('status-msg').innerText = "詳細を見るユーザーを1名以上選択してください";
                return;
            }
            
            const names = Array.from(selectedBtns).map(btn => btn.getAttribute('data-name')).join(',');
            document.getElementById('status-msg').innerText = "詳細データを読み込み中...";
            
            const res = await fetch(`${GAS_URL}?action=getMultipleRecords&names=${encodeURIComponent(names)}&t=${new Date().getTime()}`);
            const userRecordsMap = await res.json();
            
            const detailContent = document.getElementById('detail-content');
            detailContent.innerHTML = "";
            
            let hasData = false;
            for (let name in userRecordsMap) {
                const records = userRecordsMap[name];
                if (records && records.length > 0) {
                    hasData = true;

                    // 昇順（古い日付が上：8/6, 8/12, 8/16...）にソート
                    records.sort((a, b) => {
                        const dateA = new Date(a["記録日"] || a["日付"] || 0);
                        const dateB = new Date(b["記録日"] || b["日付"] || 0);
                        return dateA - dateB;
                    });

                    const deletedRecord = records.find(rec => rec["ステータス"] && rec["ステータス"].startsWith("過去に削除済み"));
                    const deletedBadge = deletedRecord ? `<span class="badge-deleted">${deletedRecord["ステータス"]}</span>` : "";

                    let html = `<h3>${name} さんの記録 ${deletedBadge}</h3>`;
                    html += `<div class="table-container"><table><thead><tr>`;
                    html += `<th>日付</th><th>体調</th><th>服薬今朝</th><th>服薬昼</th><th>服薬夕</th><th>服薬就寝前</th><th>食事今朝</th><th>食事昼</th><th>食事夕</th><th>昨夜就寝時間</th><th>本日起床時間</th><th>体温</th><th>特記事項</th><th>登録日時(更新)</th>`;
                    html += `</tr></thead><tbody>`;

                    records.forEach(rec => {
                        let rawDate = rec["記録日"] || rec["日付"] || '-';
                        let dateOnly = rawDate.split(' ')[0];

                        html += `<tr>`;
                        html += `<td><b>${dateOnly}</b></td>`;
                        html += `<td>${rec["体調"] || '-'}</td>`;
                        html += `<td>${rec["服薬今朝"] || '-'}</td>`;
                        html += `<td>${rec["服薬昨昼"] || '-'}</td>`;
                        html += `<td>${rec["服薬昨夕"] || '-'}</td>`;
                        html += `<td>${rec["服薬就寝前"] || '-'}</td>`;
                        html += `<td>${rec["食事今朝"] || '-'}</td>`;
                        html += `<td>${rec["食事昨昼"] || '-'}</td>`;
                        html += `<td>${rec["食事昨夕"] || '-'}</td>`;
                        html += `<td>${rec["昨夜就寝時間"] || '-'}</td>`;
                        html += `<td>${rec["本日起床時間"] || '-'}</td>`;
                        html += `<td>${rec["体温"] || '-'}</td>`;
                        html += `<td style="text-align:left; max-width:150px; overflow:hidden; text-overflow:ellipsis;">${rec["特記事項"] || '-'}</td>`;
                        html += `<td>${rec["更新日時"] || '-'}</td>`;
                        html += `</tr>`;
                    });

                    html += `</tbody></table></div>`;
                    detailContent.innerHTML += html;
                }
            }

            if (!hasData) {
                detailContent.innerHTML = "<p>選択されたユーザーの記録データがまだありません。</p>";
            }

            document.getElementById('page-list').classList.remove('active');
            document.getElementById('page-detail').classList.add('active');
            document.getElementById('status-msg').innerText = "";
        }

        function backToList() {
            document.getElementById('page-detail').classList.remove('active');
            document.getElementById('page-list').classList.add('active');
        }

        async function deleteSelected() {
            const selectedBtns = document.querySelectorAll('.select-btn.selected');
            if (selectedBtns.length === 0) {
                document.getElementById('status-msg').innerText = "削除する項目が選択されていません";
                return;
            }

            const rows = Array.from(selectedBtns).map(btn => parseInt(btn.getAttribute('data-row')));
            document.getElementById('status-msg').innerText = "削除処理中...";

            await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'delete', rows: rows }) 
            });

            document.getElementById('status-msg').innerText = "選択項目を削除しました";
            loadUsers();
        }

        loadUsers();

        setInterval(() => {
            if (document.getElementById('page-list').classList.contains('active')) {
                loadUsers(true);
            }
        }, 15000);
    </script>
</body>
</html>
