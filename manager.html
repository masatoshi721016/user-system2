<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理者画面</title>
</head>
<body>
    <h2>登録者一覧</h2>
    <button onclick="deleteSelected()" style="margin-bottom: 10px; padding: 5px 10px;">選択したデータを削除</button>
    <table id="table" border="1" style="border-collapse: collapse; width: 100%;">
        <thead>
            <tr style="background: #f2f2f2;">
                <th style="padding: 8px;">選択</th>
                <th style="padding: 8px;">名前</th>
                <th style="padding: 8px;">PIN</th>
                <th style="padding: 8px;">日時</th>
            </tr>
        </thead>
        <tbody id="body"></tbody>
    </table>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2RIgX8u2u7aaBRE85pUXNk0E0h_xcKMQoIODMds__fzDYJlcowdbALuwcj9a_lJQM/exec';

        async function load() {
            try {
                const res = await fetch(GAS_URL);
                const data = await res.json();
                const body = document.getElementById('body');
                body.innerHTML = '';
                
                if (data.length === 0) {
                    body.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:10px;">データがありません</td></tr>';
                    return;
                }

                data.forEach(d => {
                    body.innerHTML += `<tr>
                        <td style="text-align:center;"><input type="checkbox" class="del-check" value="${d.row}"></td>
                        <td style="padding: 8px;">${d.name}</td>
                        <td style="padding: 8px;">${d.pin}</td>
                        <td style="padding: 8px;">${d.date}</td>
                    </tr>`;
                });
            } catch (e) {
                console.error(e);
                alert('データの読み込みに失敗しました');
            }
        }

        async function deleteSelected() {
            const checks = document.querySelectorAll('.del-check:checked');
            if (checks.length === 0) {
                alert('削除するデータを選択してください');
                return;
            }
            if (!confirm(checks.length + '件のデータを削除しますか？')) return;

            // 重要：行番号が大きい順（後ろから）に並び替えることで行ズレを防ぐ
            const rowsToDelete = Array.from(checks).map(c => parseInt(c.value)).sort((a, b) => b - a);

            for (let row of rowsToDelete) {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'delete', row: row })
                });
            }
            
            // サーバー側の反映を少し待ってから再読み込み
            setTimeout(() => {
                alert('削除が完了しました');
                load();
            }, 1000);
        }

        load();
    </script>
</body>
</html>
