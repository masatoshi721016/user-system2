<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            padding: 15px; 
            max-width: 900px; 
            margin: 0 auto; 
            background: #f4f6f8; 
            font-size: 15px; 
            color: #333;
        }
        h2 { font-size: 22px; text-align: center; margin-bottom: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .action-btn { 
            flex: 1; 
            padding: 10px 14px; 
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            font-family: inherit; 
            min-width: 120px;
        }
        .update-btn { background: #007BFF; color: white; }
        .update-btn:hover { background: #0056b3; }
        .info-btn { background: #17a2b8; color: white; }
        .info-btn:hover { background: #138496; }
        .delete-btn { background: #dc3545; color: white; }
        .delete-btn:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: center; font-size: 14px; }
        th { background: #f1f3f5; color: #333; font-weight: bold; }
        .status-msg { text-align: center; font-size: 14px; color: #666; margin-bottom: 10px; font-weight: bold; }
        input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        .view { display: none; }
        .view.active { display: block; }
        .back-btn { background: #6c757d; color: white; margin-bottom: 12px; min-width: auto; flex: none; width: auto; padding: 8px 14px; font-size: 14px; }
    </style>
</head>
<body>
    <!-- 一覧画面ビュー -->
    <div id="view-list" class="card view active">
        <h2>登録者一覧（管理画面）</h2>
        <div id="manager-status" class="status-msg"></div>
        
        <div class="btn-group">
            <button class="action-btn update-btn" onclick="loadUsers()">手動更新</button>
            <button class="action-btn info-btn" onclick="goToUserInfo()">ユーザー情報へ</button>
            <button class="action-btn delete-btn" onclick="deleteSelected()">選択項目を削除</button>
        </div>

        <table id="user-table">
            <thead>
                <tr>
                    <th style="width: 40px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
                    <th>名前</th>
                    <th>PIN</th>
                    <th>登録日時</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- ユーザー情報ページビュー（コンパクトな横長テーブル表示） -->
    <div id="view-info" class="card view">
        <button class="action-btn back-btn" onclick="showListView()">← 一覧に戻る</button>
        <h2 id="info-title">ユーザー情報（記録一覧）</h2>
        <div id="info-status" class="status-msg"></div>
        <table id="record-table">
            <thead>
                <tr>
                    <th>名前</th>
                    <th>出勤</th>
                    <th>休憩入り</th>
                    <th>休憩戻り</th>
                    <th>退勤</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec";
        let allUsers = [];

        async function loadUsers() {
            const statusEl = document.getElementById('manager-status');
            statusEl.innerText = "読み込み中…";
            try {
                const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
                const data = await res.json();
                allUsers = Array.isArray(data) ? data : (data.users || []);
                
                const tbody = document.querySelector('#user-table tbody');
                tbody.innerHTML = '';
                
                if (allUsers.length === 0) {
                    statusEl.innerText = "登録されているデータはありません";
                    return;
                }

                allUsers.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="checkbox" class="row-checkbox" value="${user.row}" data-name="${user.name}"></td>
                        <td>${user.name}</td>
                        <td>${user.pin}</td>
                        <td>${user.date || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
                statusEl.innerText = "";
            } catch (e) {
                statusEl.innerText = "データの読み込みに失敗しました";
            }
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        async function goToUserInfo() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length === 0) {
                document.getElementById('manager-status').innerText = "ユーザーが選択されていません";
                return;
            }

            const userNames = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-name'));
            
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-info').classList.add('active');
            
            const statusEl = document.getElementById('info-status');
            statusEl.innerText = "読み込み中…";

            try {
                const res = await fetch(GAS_URL + '?names=' + encodeURIComponent(userNames.join(',')) + '&t=' + new Date().getTime());
                const data = await res.json();
                const records = data.records || [];
                
                const tbody = document.querySelector('#record-table tbody');
                tbody.innerHTML = '';

                if (records.length === 0) {
                    statusEl.innerText = "該当する記録データはありません";
                    return;
                }

                const userSummary = {};
                userNames.forEach(name => {
                    userSummary[name] = { name: name, 出勤: '-', 休憩入り: '-', 休憩戻り: '-', 退勤: '-' };
                });

                records.forEach(rec => {
                    if (userSummary[rec.name]) {
                        userSummary[rec.name][rec.item] = rec.time;
                    }
                });

                userNames.forEach(name => {
                    const info = userSummary[name];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${info.name}</b></td>
                        <td>${info.出勤}</td>
                        <td>${info.休憩入り}</td>
                        <td>${info.休憩戻り}</td>
                        <td>${info.退勤}</td>
                    `;
                    tbody.appendChild(tr);
                });

                statusEl.innerText = "";
            } catch (e) {
                statusEl.innerText = "履歴の読み込みに失敗しました";
            }
        }

        function showListView() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-list').classList.add('active');
            document.getElementById('manager-status').innerText = "";
        }

        async function deleteSelected() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length === 0) {
                document.getElementById('manager-status').innerText = "削除する項目が選択されていません";
                return;
            }

            const rows = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
            const statusEl = document.getElementById('manager-status');
            statusEl.innerText = "削除中…";

            try {
                await fetch(GAS_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'delete', rows: rows }) 
                });

                setTimeout(() => {
                    statusEl.innerText = "";
                    document.getElementById('select-all').checked = false;
                    loadUsers();
                }, 1000);
            } catch (e) {
                statusEl.innerText = "削除に失敗しました";
            }
        }

        loadUsers();
    </script>
</body>
</html>
