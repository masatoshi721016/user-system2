<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理者画面</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            padding: 15px; 
            max-width: 800px; 
            margin: 0 auto; 
            font-size: 16px; 
        }
        h2 { font-size: 24px; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        button { padding: 8px 15px; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: bold; border-radius: 6px; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
        input[type="checkbox"] { transform: scale(1.2); margin-right: 5px; }
        .auto-status { font-size: 13px; color: #555; margin-left: 10px; }
    </style>
</head>
<body>
    <h2>登録者一覧</h2>
    <div class="controls">
        <button onclick="load()" style="background: #007BFF; color: white; border: none;">🔄 手動更新</button>
        <button onclick="deleteSelected()" style="background: #dc3545; color: white; border: none;">選択したデータを削除</button>
        <span class="auto-status">※30秒ごとに自動更新されます</span>
    </div>
    
    <table id="table">
        <thead>
            <tr>
                <th style="width: 50px; text-align: center;">選択</th>
                <th>名前</th>
                <th>PIN</th>
                <th>日時</th>
            </tr>
        </thead>
        <tbody id="body">
            <tr><td colspan="4" style="text-align:center;">読み込み中...</td></tr>
        </tbody>
    </table>

    <script>
        // 新しいGASのWebアプリURLを組み込み済みです
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec';

        async function load() {
            try {
                const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
                const data = await res.json();
                const body = document.getElementById('body');
                body.innerHTML = '';
                
                if (data.length === 0) {
                    body.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:15px;">データがありません</td></tr>';
                    return;
                }

                data.forEach(d => {
                    // PINを4桁文字列（0123）へ確実に復元
                    let pinStr = String(d.pin || '').trim().replace(/^'/, '');
                    if (pinStr.length > 0 && pinStr.length < 4) {
                        pinStr = pinStr.padStart(4, '0');
                    }

                    body.innerHTML += `<tr>
                        <td style="text-align:center;"><input type="checkbox" class="del-check" value="${d.row}"></td>
                        <td>${d.name}</td>
                        <td>${pinStr}</td>
                        <td>${d.date}</td>
                    </tr>`;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteSelected() {
            const checks = document.querySelectorAll('.del-check:checked');
            if (checks.length === 0) {
                alert('削除するデータを選択してください');
                return;
            }
            if (!confirm(checks.length + '件のデータを削除しますか？')) return;

            const rowsToDelete = Array.from(checks).map(c => parseInt(c.value)).sort((a, b) => b - a);

            for (let row of rowsToDelete) {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'delete', row: row })
                });
            }
            
            setTimeout(() => {
                alert('削除が完了しました');
                load();
            }, 1000);
        }

        // 初回読み込み
        load();

        // 30秒ごとに自動更新
        setInterval(load, 30000);
    </script>
</body>
</html>
