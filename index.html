<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>利用者画面</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f8; max-width: 600px; margin: 0 auto; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* 大きめで押しやすいメニューボタン */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, background 0.2s;
            text-align: center;
        }
        .menu-btn:active { transform: scale(0.98); }
        
        .btn-attendance { background: #0284c7; }
        .btn-attendance:hover { background: #0369a1; }
        
        .btn-health { background: #16a34a; }
        .btn-health:hover { background: #15803d; }
        
        .btn-record { background: #7c3aed; }
        .btn-record:hover { background: #6d28d9; }

        .btn-secondary { background: #64748b; color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
        .btn-secondary:hover { background: #475569; }

        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        textarea { resize: vertical; height: 80px; }
        
        .btn-primary { background: #2563eb; color: white; width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
        
        .tab-container { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #64748b; }
        .tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; margin-bottom: -2px; }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px; color: #475569; }
    </style>
</head>
<body>

    <!-- 1. ログイン ＆ 新規登録ページ -->
    <div id="page-auth" class="page active">
        <div class="card" style="text-align: center;">
            <div class="tab-container">
                <div id="tab-login" class="tab active" onclick="switchTab('login')">ログイン</div>
                <div id="tab-register" class="tab" onclick="switchTab('register')">新規登録</div>
            </div>

            <!-- ログインフォーム -->
            <div id="form-login">
                <h2 style="margin-top:0;">利用者ログイン</h2>
                <input type="text" id="login-name" placeholder="お名前">
                <input type="password" id="login-pin" placeholder="4桁PINコード" maxlength="4">
                <button class="btn-primary" onclick="handleLogin()" style="margin-top: 10px;">ログイン</button>
            </div>

            <!-- 新規登録フォーム -->
            <div id="form-register" style="display: none;">
                <h2 style="margin-top:0;">新規ユーザー登録</h2>
                <input type="text" id="reg-name" placeholder="お名前">
                <input type="password" id="reg-pin" placeholder="4桁PINコードを設定" maxlength="4">
                <button class="btn-primary" onclick="handleRegister()" style="margin-top: 10px; background: #16a34a;">登録する</button>
            </div>
        </div>
    </div>

    <!-- 2. メニュー選択ページ（3択） -->
    <div id="page-menu" class="page">
        <div class="card" style="text-align: center;">
            <h2>メニュー選択</h2>
            <p style="color: #64748b; margin-bottom: 25px;">報告・記録する項目を選択してください</p>
            
            <button class="menu-btn btn-attendance" onclick="switchPage('page-attendance')">
                📋 当日勤怠報告
            </button>
            
            <button class="menu-btn btn-health" onclick="switchPage('page-health')">
                🌡️ 体調管理
            </button>
            
            <button class="menu-btn btn-record" onclick="switchPage('page-record')">
                📝 就労移行支援提供実績記録
            </button>
            
            <div style="margin-top: 25px; text-align: left;">
                <button class="btn-secondary" onclick="logout()">← ログアウト</button>
            </div>
        </div>
    </div>

    <!-- 3-1. 当日勤怠報告ページ -->
    <div id="page-attendance" class="page">
        <div class="card">
            <h2>当日勤怠報告</h2>
            <p style="color: #64748b; margin-bottom: 20px;">本日の勤怠状況を入力してください。</p>
            
            <div class="form-group">
                <label>出勤状況</label>
                <select id="att-status">
                    <option value="出勤">出勤</option>
                    <option value="欠席">欠席</option>
                    <option value="遅刻">遅刻</option>
                    <option value="早退">早退</option>
                </select>
            </div>
            <div class="form-group">
                <label>備考・連絡事項</label>
                <textarea id="att-note" placeholder="特になし"></textarea>
            </div>

            <button class="btn-primary" onclick="submitAttendance()" style="margin-top: 15px;">勤怠を送信する</button>

            <div style="margin-top: 25px; text-align: left;">
                <button class="btn-secondary" onclick="switchPage('page-menu')">← メニューに戻る</button>
            </div>
        </div>
    </div>

    <!-- 3-2. 体調管理ページ（元の入力項目を網羅） -->
    <div id="page-health" class="page">
        <div class="card">
            <h2>体調管理</h2>
            <p style="color: #64748b; margin-bottom: 20px;">本日の体調や体温を入力してください。</p>
            
            <div class="form-group">
                <label>体調</label>
                <select id="h-condition">
                    <option value="〇">〇 (良好)</option>
                    <option value="△">△ (やや不調)</option>
                    <option value="✕">✕ (不調)</option>
                </select>
            </div>

            <div class="form-group">
                <label>体温 (°C)</label>
                <input type="number" step="0.1" id="h-temp" placeholder="36.5">
            </div>

            <div class="form-group">
                <label>服薬（今朝 / 昼 / 夕 / 就寝前）</label>
                <div style="display: flex; gap: 8px;">
                    <select id="h-med-m"><option value="〇">朝:〇</option><option value="✕">朝:✕</option><option value="／">朝:/</option></select>
                    <select id="h-med-d"><option value="〇">昼:〇</option><option value="✕">昼:✕</option><option value="／">昼:/</option></select>
                    <select id="h-med-e"><option value="〇">夕:〇</option><option value="✕">夕:✕</option><option value="／">夕:/</option></select>
                    <select id="h-med-n"><option value="〇">就寝:〇</option><option value="✕">就寝:✕</option><option value="／">就寝:/</option></select>
                </div>
            </div>

            <div class="form-group">
                <label>昨夜の就寝時間 / 本日の起床時間</label>
                <div style="display: flex; gap: 8px;">
                    <input type="time" id="h-sleep" style="margin:0;">
                    <input type="time" id="h-wake" style="margin:0;">
                </div>
            </div>

            <div class="form-group">
                <label>特記事項</label>
                <textarea id="h-note" placeholder="特になし"></textarea>
            </div>

            <button class="btn-primary" onclick="submitHealth()" style="margin-top: 15px; background: #16a34a;">体調記録を送信する</button>

            <div style="margin-top: 25px; text-align: left;">
                <button class="btn-secondary" onclick="switchPage('page-menu')">← メニューに戻る</button>
            </div>
        </div>
    </div>

    <!-- 3-3. 就労移行支援提供実績記録ページ -->
    <div id="page-record" class="page">
        <div class="card">
            <h2>就労移行支援提供実績記録</h2>
            <p style="color: #64748b; margin-bottom: 20px;">本日の支援内容・実績を入力してください。</p>
            
            <div class="form-group">
                <label>利用プログラム・活動内容</label>
                <textarea id="rec-content" placeholder="例：PC訓練、面談練習など"></textarea>
            </div>

            <button class="btn-primary" onclick="submitRecord()" style="margin-top: 15px; background: #7c3aed;">実績記録を送信する</button>

            <div style="margin-top: 25px; text-align: left;">
                <button class="btn-secondary" onclick="switchPage('page-menu')">← メニューに戻る</button>
            </div>
        </div>
    </div>

    <script>
        // ログイン/新規登録のタブ切り替え
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('form-register').style.display = 'block';
                document.getElementById('form-login').style.display = 'none';
            }
        }

        // ページ切り替え関数
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // ログイン処理
        function handleLogin() {
            const name = document.getElementById('login-name').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            if (!name || !pin) {
                alert("お名前と4桁PINコードを入力してください。");
                return;
            }
            // 認証ロジック（必要に応じてGAS呼び出し等に変更可能）
            switchPage('page-menu');
        }

        // 新規登録処理
        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            if (!name || !pin) {
                alert("お名前と設定するPINコードを入力してください。");
                return;
            }
            alert("登録が完了しました。ログインしてください。");
            switchTab('login');
        }

        // ログアウト処理
        function logout() {
            document.getElementById('login-name').value = "";
            document.getElementById('login-pin').value = "";
            switchPage('page-auth');
        }

        // 各送信処理のプレースホルダー（必要に応じてGASへのデータ保存処理を記述）
        function submitAttendance() {
            alert("当日勤怠報告を送信しました。");
            switchPage('page-menu');
        }

        function submitHealth() {
            alert("体調管理データを送信しました。");
            switchPage('page-menu');
        }

        function submitRecord() {
            alert("実績記録を送信しました。");
            switchPage('page-menu');
        }
    </script>
</body>
</html>
