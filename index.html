<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン/登録</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f9f9f9; font-size: 24px; }
        h2 { font-size: 36px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .tab { display: flex; margin-bottom: 25px; }
        .tab button { flex: 1; padding: 18px; border: none; background: #eee; cursor: pointer; font-weight: bold; font-size: 22px; border-radius: 10px; }
        .tab button.active { background: #007BFF; color: white; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; }
        input { width: 100%; padding: 18px; border: 2px solid #ccc; border-radius: 10px; font-size: 24px; box-sizing: border-box; }
        .pin-container { position: relative; display: flex; align-items: center; }
        .toggle-btn { position: absolute; right: 15px; background: none; border: none; font-size: 28px; cursor: pointer; }
        .submit-btn { width: 100%; padding: 20px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 26px; font-weight: bold; cursor: pointer; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <!-- タブ -->
        <div class="tab" id="tabs">
            <button class="active" onclick="show('view-login')">ログイン</button>
            <button onclick="show('view-register')">新規登録</button>
        </div>

        <!-- ログイン -->
        <div id="view-login" class="view active">
            <h2>ログイン</h2>
            <div class="form-group">
                <label>暗証番号（4けた）</label>
                <div class="pin-container">
                    <input type="password" id="login-pin" placeholder="例：0123" maxlength="4">
                    <button class="toggle-btn" onclick="toggle(this)">👁️</button>
                </div>
            </div>
            <button class="submit-btn" onclick="handleLogin()">ログイン</button>
        </div>

        <!-- 新規登録 -->
        <div id="view-register" class="view">
            <h2>新規登録</h2>
            <div class="form-group">
                <label>名前</label>
                <input type="text" id="reg-name" placeholder="山田 太郎">
            </div>
            <div class="form-group">
                <label>暗証番号（4けた）</label>
                <div class="pin-container">
                    <input type="password" id="reg-pin" placeholder="例：0123" maxlength="4">
                    <button class="toggle-btn" onclick="toggle(this)">👁️</button>
                </div>
            </div>
            <button class="submit-btn" onclick="handleRegister()">登録する</button>
        </div>

        <!-- ログイン後入力画面 -->
        <div id="view-input" class="view">
            <h2 id="welcome"></h2>
            <div class="form-group">
                <label>メモ入力</label>
                <input type="text" id="memo" placeholder="内容を入力">
            </div>
            <button class="submit-btn" style="background:#007BFF" onclick="goHome()">送信・終了</button>
        </div>
    </div>

    <script>
        const GAS_URL = "あなたのGASのURL";
        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function toggle(btn) {
            const input = btn.previousElementSibling;
            input.type = (input.type === 'password') ? 'text' : 'password';
        }
        async function handleLogin() {
            const pin = document.getElementById('login-pin').value;
            const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
            const data = await res.json();
            const user = data.find(u => String(u.pin) === pin);
            if (user) {
                document.getElementById('welcome').innerText = user.name + "さん、こんにちは！";
                show('view-input');
            } else { alert("暗証番号が違います"); }
        }
        async function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const pin = document.getElementById('reg-pin').value;
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({action:'add', name, pin})});
            alert("登録しました");
            location.reload();
        }
        function goHome() { alert("送信しました"); location.reload(); }
    </script>
</body>
</html>
