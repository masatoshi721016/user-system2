<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録・ログイン</title>
    <!-- Google Fonts から丸文字（M PLUS Rounded 1c）を読み込む -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            padding: 30px; 
            max-width: 500px; 
            margin: 0 auto; 
            background: #f9f9f9; 
            font-size: 24px; 
        }
        h2 { font-size: 36px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .tab { display: flex; margin-bottom: 25px; }
        .tab button { flex: 1; padding: 18px; border: none; background: #eee; cursor: pointer; font-weight: bold; font-size: 22px; border-radius: 10px 10px 0 0; font-family: inherit; }
        .tab button.active { background: #007BFF; color: white; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-size: 22px; font-weight: bold; }
        input { width: 100%; padding: 18px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 10px; font-size: 24px; font-family: inherit; }
        .pin-container { position: relative; }
        .pin-container input { padding-right: 60px; }
        .toggle-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 28px; }
        .submit-btn { width: 100%; padding: 20px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 26px; font-family: inherit; font-weight: bold; }
        .submit-btn:hover { background: #218838; }
        .logout-btn { background: #dc3545; }
        .logout-btn:hover { background: #c82333; }
        .view { display: none; }
        .view.active { display: block; }
        .welcome-msg { font-size: 30px; color: #007BFF; text-align: center; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <!-- タブ -->
        <div class="tab" id="auth-tabs">
            <button id="tab-login" class="active" onclick="switchTab('login')">ログイン</button>
            <button id="tab-register" onclick="switchTab('register')">新規登録</button>
        </div>

        <!-- ログイン画面 -->
        <div id="view-login" class="view active">
            <h2>ログイン</h2>
            <div class="form-group">
                <label>4桁PIN</label>
                <div class="pin-container">
                    <input type="tel" id="login-pin" placeholder="例: 0123" maxlength="4">
                    <button type="button" class="toggle-btn" onclick="togglePin('login-pin', this)">👁️</button>
                </div>
            </div>
            <button class="submit-btn" onclick="handleLogin()">ログイン</button>
        </div>

        <!-- 新規登録画面 -->
        <div id="view-register" class="view">
            <h2>新規登録</h2>
            <div class="form-group">
                <label>お名前</label>
                <input type="text" id="reg-name" placeholder="お名前を入力">
            </div>
            <div class="form-group">
                <label>4桁PIN（半角数字）</label>
                <div class="pin-container">
                    <input type="tel" id="reg-pin" placeholder="半角数字4桁（0始まり可）" maxlength="4">
                    <button type="button" class="toggle-btn" onclick="togglePin('reg-pin', this)">👁️</button>
                </div>
            </div>
            <button class="submit-btn" onclick="handleRegister()">登録する</button>
        </div>

        <!-- ログイン後の入力画面 -->
        <div id="view-mypage" class="view">
            <div id="welcome-text" class="welcome-msg"></div>
            <div class="form-group">
                <label>メモや入力を記述</label>
                <input type="text" id="user-memo" placeholder="内容を入力">
            </div>
            <button class="submit-btn logout-btn" onclick="handleLogout()">終了（ログアウト）</button>
        </div>
    </div>

    <script>
        // 新しいGASのWebアプリURLを組み込み済みです
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec';

        function switchTab(tab) {
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('view-login').classList.toggle('active', tab === 'login');
            document.getElementById('view-register').classList.toggle('active', tab === 'register');
        }

        function togglePin(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password' || input.type === 'tel') {
                input.type = 'text';
                btn.textContent = '🔒';
            } else {
                input.type = 'tel';
                btn.textContent = '👁️';
            }
        }

        async function handleLogin() {
            let pin = document.getElementById('login-pin').value.trim();
            if (!/^\d{4}$/.test(pin)) {
                alert('エラー: PINは半角数字4桁で入力してください。');
                return;
            }

            try {
                const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
                const data = await res.json();
                
                // 取得したPINを4桁文字列補正して比較
                const user = data.find(d => {
                    let userPin = String(d.pin || '').trim();
                    if (userPin.length > 0 && userPin.length < 4) userPin = userPin.padStart(4, '0');
                    return userPin === pin;
                });

                if (!user) {
                    alert('エラー: 該当するPINが見つかりません。新規登録してください。');
                    return;
                }

                document.getElementById('welcome-text').innerText = `${user.name} さん、こんにちは！`;
                document.getElementById('auth-tabs').style.display = 'none';
                document.getElementById('view-login').classList.remove('active');
                document.getElementById('view-mypage').classList.add('active');
                document.getElementById('login-pin').value = '';
            } catch (e) {
                alert('通信エラーが発生しました。');
            }
        }

        function handleLogout() {
            document.getElementById('auth-tabs').style.display = 'flex';
            document.getElementById('view-mypage').classList.remove('active');
            document.getElementById('view-login').classList.add('active');
            document.getElementById('user-memo').value = '';
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            let pin = document.getElementById('reg-pin').value.trim();

            if (!name) {
                alert('エラー: お名前を入力してください。');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                alert('エラー: PINは半角数字4桁で入力してください（0123なども可能です）。');
                return;
            }

            // PINを明示的な文字列（'付き）として送信
            const data = { action: 'add', name: name, pin: "'" + pin };
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                alert('登録が完了しました！ログイン画面に移動します。');
                
                document.getElementById('reg-name').value = '';
                document.getElementById('reg-pin').value = '';

                switchTab('login');
            } catch (e) {
                alert('エラーが発生しました。通信環境を確認してください。');
            }
        }
    </script>
</body>
</html>
