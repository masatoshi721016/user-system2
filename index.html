<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体調管理チェック</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; max-width: 480px; margin: 0 auto; background: #f0f2f5; color: #333; font-size: 15px; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h2 { text-align: center; font-size: 18px; margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 14px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fff; }
        textarea { height: 70px; resize: vertical; }
        .btn { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn:active { background: #004fb3; }
        .btn-secondary { background: #65676b; }
        .tab-group { display: flex; margin-bottom: 18px; border-radius: 8px; overflow: hidden; border: 1px solid #ccd0d5; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #f0f2f5; cursor: pointer; font-weight: bold; font-size: 14px; color: #65676b; }
        .tab.active { background: #0066cc; color: white; }
        .view { display: none; }
        .view.active { display: block; }
        .row-inputs { display: flex; gap: 6px; }
        .row-inputs > div { flex: 1; text-align: center; }
        .row-inputs small { font-size: 11px; color: #666; display: block; margin-bottom: 2px; }
        .confirm-box p { margin: 6px 0; border-bottom: 1px solid #eee; padding-bottom: 4px; font-size: 14px; }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }
    </style>
</head>
<body>

    <!-- 1. ログイン / 新規登録画面 -->
    <div id="view-auth" class="card view active">
        <div class="tab-group">
            <div id="tab-login" class="tab active" onclick="switchTab('login')">ログイン</div>
            <div id="tab-reg" class="tab" onclick="switchTab('reg')">新規登録</div>
        </div>
        
        <div id="form-login">
            <h2>ログイン</h2>
            <div class="form-group"><label>名前</label><input type="text" id="login-name" placeholder="例: 山田太郎"></div>
            <div class="form-group"><label>PINコード (4桁)</label><input type="password" id="login-pin" maxlength="4" placeholder="••••"></div>
            <button class="btn" onclick="login()">ログイン</button>
        </div>

        <div id="form-reg" style="display:none;">
            <h2>新規登録</h2>
            <div class="form-group"><label>名前</label><input type="text" id="reg-name" placeholder="例: 山田太郎"></div>
            <div class="form-group"><label>PINコード (4桁)</label><input type="password" id="reg-pin" maxlength="4" placeholder="••••"></div>
            <button class="btn" onclick="register()">登録</button>
        </div>
    </div>

    <!-- 2. 詳細入力画面 -->
    <div id="view-form" class="card view">
        <div class="user-header">
            <span id="welcome-user" style="font-weight:bold; color:#0066cc;"></span>
            <button onclick="logout()" style="padding:4px 8px; font-size:12px; background:#e4e6eb; border:none; border-radius:4px; cursor:pointer;">ログアウト</button>
        </div>
        <h2>体調管理チェック</h2>

        <div class="form-group"><label>体調</label>
            <select id="体調"><option>〇</option><option>△</option><option>✕</option></select>
        </div>

        <label>服薬状況</label>
        <div class="form-group row-inputs">
            <div><small>今朝</small><select id="服薬今朝"><option>〇</option><option>／</option><option>✕</option></select></div>
            <div><small>昨昼</small><select id="服薬昨昼"><option>〇</option><option>／</option><option>✕</option></select></div>
            <div><small>昨夕</small><select id="服薬昨夕"><option>〇</option><option>／</option><option>✕</option></select></div>
            <div><small>就寝前</small><select id="服薬就寝前"><option>〇</option><option>／</option><option>✕</option></select></div>
        </div>

        <label>食事状況</label>
        <div class="form-group row-inputs">
            <div><small>今朝</small><select id="食事今朝"><option>〇</option><option>／</option><option>✕</option></select></div>
            <div><small>昨昼</small><select id="食事昨昼"><option>〇</option><option>／</option><option>✕</option></select></div>
            <div><small>昨夕</small><select id="食事昨夕"><option>〇</option><option>／</option><option>✕</option></select></div>
        </div>

        <div class="form-group"><label>昨夜就寝時間 (4桁)</label><input type="number" id="昨夜就寝時間" placeholder="2300"></div>
        <div class="form-group"><label>本日起床時間 (4桁)</label><input type="number" id="本日起床時間" placeholder="0700"></div>
        <div class="form-group"><label>体温 (下1桁まで)</label><input type="number" id="体温" step="0.1" placeholder="36.5"></div>
        <div class="form-group"><label>特記事項</label><textarea id="特記事項" placeholder="特になし"></textarea></div>

        <button class="btn" onclick="goToConfirm()">確認画面へ</button>
    </div>

    <!-- 3. 確認画面 -->
    <div id="view-confirm" class="card view">
        <h2>入力内容の確認</h2>
        <div class="confirm-box" id="confirm-content"></div>
        <button class="btn" onclick="submitData()">送信する</button>
        <button class="btn btn-secondary" onclick="backToForm()">修正する</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkqWE0t52f1laN02b-TrBAL0ZGR6xQ8ap6Q6ysARtdLKuQkVCrxAfMqmgDrqWVboFy/exec";
        let currentUser = "";
        let formData = {};

        function switchTab(type) {
            if(type==='login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-reg').classList.remove('active');
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-reg').style.display = 'none';
            } else {
                document.getElementById('tab-reg').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-reg').style.display = 'block';
            }
        }

        async function register() {
            const name = document.getElementById('reg-name').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            if(!name || pin.length !== 4) return alert("名前と4桁のPINを入力してください");

            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'add', name, pin }) });
            const result = await res.json();
            
            if(result.status === 'exists') {
                alert("すでに登録されている名前です");
                return;
            }

            alert("登録が完了しました。ログインしてください。");
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-pin').value = '';
            switchTab('login');
        }

        async function login() {
            const name = document.getElementById('login-name').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            if(!name || !pin) return alert("名前とPINを入力してください");

            const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
            const users = await res.json();
            const user = users.find(u => u.name === name && u.pin === pin);

            if(user) {
                currentUser = name;
                document.getElementById('welcome-user').innerText = "ログイン中: " + currentUser;
                changeView('view-form');
            } else {
                alert("名前またはPINが違います");
            }
        }

        function logout() {
            currentUser = "";
            document.getElementById('login-name').value = '';
            document.getElementById('login-pin').value = '';
            changeView('view-auth');
        }

        function goToConfirm() {
            formData = {
                体調: document.getElementById('体調').value,
                服薬今朝: document.getElementById('服薬今朝').value,
                服薬昨昼: document.getElementById('服薬昨昼').value,
                服薬昨夕: document.getElementById('服薬昨夕').value,
                服薬就寝前: document.getElementById('服薬就寝前').value,
                食事今朝: document.getElementById('食事今朝').value,
                食事昨昼: document.getElementById('食事昨昼').value,
                食事昨夕: document.getElementById('食事昨夕').value,
                昨夜就寝時間: document.getElementById('昨夜就寝時間').value,
                本日起床時間: document.getElementById('本日起床時間').value,
                体温: document.getElementById('体温').value,
                特記事項: document.getElementById('特記事項').value
            };

            const html = `
                <p><b>名前:</b> ${currentUser}</p>
                <p><b>体調:</b> ${formData.体調}</p>
                <p><b>服薬:</b> 今朝(${formData.服薬今朝}) 昼(${formData.服薬昨昼}) 夕(${formData.服薬昨夕}) 就寝前(${formData.服薬就寝前})</p>
                <p><b>食事:</b> 今朝(${formData.食事今朝}) 昼(${formData.食事昨昼}) 夕(${formData.食事昨夕})</p>
                <p><b>就寝時間:</b> ${formData.昨夜就寝時間 || '-'}</p>
                <p><b>起床時間:</b> ${formData.本日起床時間 || '-'}</p>
                <p><b>体温:</b> ${formData.体温 ? formData.体温 + '℃' : '-'}</p>
                <p><b>特記事項:</b> ${formData.特記事項 || 'なし'}</p>
            `;
            document.getElementById('confirm-content').innerHTML = html;
            changeView('view-confirm');
        }

        function backToForm() {
            changeView('view-form');
        }

        async function submitData() {
            await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'record', name: currentUser, data: formData }) 
            });
            alert("送信完了しました！");
            location.reload();
        }

        function changeView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }
    </script>
</body>
</html>
