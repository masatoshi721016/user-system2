<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>利用者画面</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f8; max-width: 600px; margin: 0 auto; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* 大きめで押しやすいメニューボタン */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, background 0.2s;
        }
        .menu-btn:active { transform: scale(0.98); }
        
        /* 1. 当日勤怠報告ボタン */
        .btn-attendance { background: #0284c7; }
        .btn-attendance:hover { background: #0369a1; }
        
        /* 2. 体調管理ボタン */
        .btn-health { background: #16a34a; }
        .btn-health:hover { background: #15803d; }
        
        /* 3. 就労移行支援提供実績記録ボタン */
        .btn-record { background: #7c3aed; }
        .btn-record:hover { background: #6d28d9; }

        .btn-secondary { background: #64748b; color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
        .btn-secondary:hover { background: #475569; }

        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        .btn-primary { background: #2563eb; color: white; width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <!-- 1. ログインページ -->
    <div id="page-login" class="page active">
        <div class="card">
            <h2>利用者ログイン</h2>
            <p style="color: #64748b; margin-bottom: 20px;">名前とPINコードを入力してください</p>
            <input type="text" id="login-name" placeholder="お名前">
            <input type="password" id="login-pin" placeholder="PINコード">
            <button class="btn-primary" onclick="handleLogin()" style="margin-top: 15px;">ログイン</button>
        </div>
    </div>

    <!-- 2. メニュー選択ページ（3択） -->
    <div id="page-menu" class="page">
        <div class="card">
            <h2>メニュー選択</h2>
            <p style="color: #64748b; margin-bottom: 25px;">報告・記録する項目を選択してください</p>
            
            <!-- ご指定の順番：当日勤怠報告 → 体調管理 → 就労移行支援提供実績記録 -->
            <button class="menu-btn btn-attendance" onclick="switchPage('page-attendance')">
                📋 当日勤怠報告
            </button>
            
            <button class="menu-btn btn-health" onclick="switchPage('page-health')">
                🌡️ 体調管理
            </button>
            
            <button class="menu-btn btn-record" onclick="switchPage('page-record')">
                📝 就労移行支援提供実績記録
            </button>
            
            <div style="margin-top: 25px; text-align: left;">
                <button class="btn-secondary" onclick="logout()">← ログアウト</button>
            </div>
        </div>
    </div>

    <!-- 3-1. 当日勤怠報告ページ -->
    <div id="page-attendance" class="page">
        <div class="card" style="text-align: left;">
            <h2>当日勤怠報告</h2>
            <p style="color: #64748b;">本日の勤怠状況を入力・送信します。</p>
            <!-- 実際の入力フォーム要素をここに配置 -->
            <div style="margin-top: 30px; text-align: center;">
                <button class="btn-secondary" onclick="switchPage('page-menu')">← メニューに戻る</button>
            </div>
        </div>
    </div>

    <!-- 3-2. 体調管理ページ -->
    <div id="page-health" class="page">
        <div class="card" style="text-align: left;">
            <h2>体調管理</h2>
            <p style="color: #64748b;">本日の体温や体調を入力・送信します。</p>
            <!-- 実際の入力フォーム要素をここに配置 -->
            <div style="margin-top: 30px; text-align: center;">
                <button class="btn-secondary" onclick="switchPage('page-menu')">← メニューに戻る</button>
            </div>
        </div>
    </div>

    <!-- 3-3. 就労移行支援提供実績記録ページ -->
    <div id="page-record" class="page">
        <div class="card" style="text-align: left;">
            <h2>就労移行支援提供実績記録</h2>
            <p style="color: #64748b;">提供実績に関する記録を入力・送信します。</p>
            <!-- 実際の入力フォーム要素をここに配置 -->
            <div style="margin-top: 30px; text-align: center;">
                <button class="btn-secondary" onclick="switchPage('page-menu')">← メニューに戻る</button>
            </div>
        </div>
    </div>

    <script>
        // ログイン処理（成功時にメニュー画面へ遷移）
        function handleLogin() {
            const name = document.getElementById('login-name').value;
            const pin = document.getElementById('login-pin').value;
            
            if (!name || !pin) {
                alert("お名前とPINコードを入力してください。");
                return;
            }
            
            // 必要に応じてGAS等との認証処理をここに記述
            
            // ログイン成功後にメニュー画面へ切り替え
            switchPage('page-menu');
        }

        // ログアウト処理
        function logout() {
            document.getElementById('login-name').value = "";
            document.getElementById('login-pin').value = "";
            switchPage('page-login');
        }

        // ページ切り替え用関数
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
