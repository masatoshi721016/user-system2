<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン / 新規登録</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 20px auto;
      padding: 0 16px;
      background-color: #f9f9f9;
    }
    
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    /* 暗証番号入力欄と目のボタンの位置合わせ設定 */
    .pin-input-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .pin-input-container input {
      padding-right: 40px; /* 右端の目のボタンと文字が重ならない設定 */
    }

    .toggle-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
      user-select: none;
    }

    button.submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button.submit-btn:hover {
      background-color: #0056b3;
    }

    .msg {
      margin-top: 10px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 新規登録フォーム -->
  <div class="card">
    <h2>新規登録</h2>
    <div class="form-group">
      <label for="regName">名前</label>
      <input type="text" id="regName" placeholder="山田 太郎">
    </div>

    <div class="form-group">
      <!-- 指定されたラベル「暗証番号（4けた）」 -->
      <label for="regPin">暗証番号（4けた）</label>
      <div class="pin-input-container">
        <!-- 初期状態は伏字（password）、入力前表示は「例：0123」 -->
        <input 
          type="password" 
          id="regPin" 
          placeholder="例：0123" 
          maxlength="4" 
          pattern="\d{4}"
          inputmode="numeric"
        />
        <!-- 目のマークボタン -->
        <button type="button" class="toggle-btn" onclick="togglePinVisibility('regPin', this)">👁️</button>
      </div>
    </div>

    <button class="submit-btn" onclick="registerUser()">登録する</button>
    <div id="regMsg" class="msg"></div>
  </div>

  <!-- ログインフォーム -->
  <div class="card">
    <h2>ログイン</h2>
    <div class="form-group">
      <label for="loginName">名前</label>
      <input type="text" id="loginName" placeholder="山田 太郎">
    </div>

    <div class="form-group">
      <!-- 指定されたラベル「暗証番号（4けた）」 -->
      <label for="loginPin">暗証番号（4けた）</label>
      <div class="pin-input-container">
        <!-- 初期状態は伏字（password）、入力前表示は「例：0123」 -->
        <input 
          type="password" 
          id="loginPin" 
          placeholder="例：0123" 
          maxlength="4" 
          pattern="\d{4}"
          inputmode="numeric"
        />
        <!-- 目のマークボタン -->
        <button type="button" class="toggle-btn" onclick="togglePinVisibility('loginPin', this)">👁️</button>
      </div>
    </div>

    <button class="submit-btn" onclick="loginUser()">ログイン</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <script>
    // ※お使いのGAS Web App URLを入れてください
    const GAS_URL = "YOUR_GAS_WEB_APP_URL"; 

    // 伏字(password)と表示(text)を切り替える関数
    function togglePinVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈"; // 表示中のときは「閉じた目」
      } else {
        input.type = "password";
        btn.textContent = "👁️"; // 伏字中のときは「開いた目」
      }
    }

    // 新規登録処理
    async function registerUser() {
      const name = document.getElementById('regName').value.trim();
      const pin = document.getElementById('regPin').value.trim();
      const msg = document.getElementById('regMsg');

      if (!name || !pin || pin.length !== 4) {
        alert("名前と4桁の暗証番号を入力してください。");
        return;
      }

      msg.textContent = "登録中...";

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "add", name: name, pin: pin })
        });
        msg.textContent = "登録が完了しました！";
        document.getElementById('regName').value = "";
        document.getElementById('regPin').value = "";
      } catch (err) {
        msg.textContent = "エラーが発生しました。";
        console.error(err);
      }
    }

    // ログイン処理
    async function loginUser() {
      const name = document.getElementById('loginName').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!name || !pin) {
        alert("名前と暗証番号を入力してください。");
        return;
      }

      msg.textContent = "確認中...";

      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        
        // 名前とPINが一致するか確認
        const user = data.find(u => u.name === name && String(u.pin) === pin);

        if (user) {
          msg.textContent = "ログイン成功！";
        } else {
          msg.textContent = "名前または暗証番号が正しくありません。";
        }
      } catch (err) {
        msg.textContent = "エラーが発生しました。";
        console.error(err);
      }
    }
  </script>
</body>
</html>
