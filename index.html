<!DOCTYPE html>
<html>
<body>
    <h2>体調管理チェック</h2>
    <form id="checkForm">
        名前: <input type="text" id="name" required><br>
        体調: <select id="体調"><option>〇</option><option>△</option><option>✕</option></select><br>
        服薬: 今朝<select id="服薬今朝"><option>〇</option><option>／</option><option>✕</option></select>
             昼<select id="服薬昨昼"><option>〇</option><option>／</option><option>✕</option></select>
             夕<select id="服薬昨夕"><option>〇</option><option>／</option><option>✕</option></select>
             就寝前<select id="服薬就寝前"><option>〇</option><option>／</option><option>✕</option></select><br>
        食事: 今朝<select id="食事今朝"><option>〇</option><option>／</option><option>✕</option></select>
             昼<select id="食事昨昼"><option>〇</option><option>／</option><option>✕</option></select>
             夕<select id="食事昨夕"><option>〇</option><option>／</option><option>✕</option></select><br>
        就寝時間(HHmm): <input type="number" id="昨夜就寝時間" placeholder="2300"><br>
        起床時間(HHmm): <input type="number" id="本日起床時間" placeholder="0700"><br>
        体温: <input type="number" id="体温" step="0.1" placeholder="36.5"><br>
        特記事項: <textarea id="特記事項"></textarea><br>
        <button type="button" onclick="submitData()">送信</button>
    </form>
    <script>
        const URL = "ここにGASのウェブアプリURL";
        async function submitData() {
            const data = {
                name: document.getElementById('name').value,
                data: {
                    体調: document.getElementById('体調').value,
                    服薬今朝: document.getElementById('服薬今朝').value,
                    服薬昨昼: document.getElementById('服薬昨昼').value,
                    服薬昨夕: document.getElementById('服薬昨夕').value,
                    服薬就寝前: document.getElementById('服薬就寝前').value,
                    食事今朝: document.getElementById('食事今朝').value,
                    食事昨昼: document.getElementById('食事昨昼').value,
                    食事昨夕: document.getElementById('食事昨夕').value,
                    昨夜就寝時間: document.getElementById('昨夜就寝時間').value,
                    本日起床時間: document.getElementById('本日起床時間').value,
                    体温: document.getElementById('体温').value,
                    特記事項: document.getElementById('特記事項').value
                }
            };
            await fetch(URL, { method: 'POST', body: JSON.stringify(data) });
            alert("送信しました");
        }
    </script>
</body>
</html>
