<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{font-family:sans-serif;padding:20px;max-width:400px;margin:0 auto;}
input,button{width:100%;padding:10px;margin-top:10px;}
button{background:#007BFF;color:white;border:none;cursor:pointer;}</style></head>
<body>
    <div id="login-view">
        <h2>ログイン/登録</h2>
        <input type="text" id="name" placeholder="お名前">
        <input type="password" id="pin" placeholder="4桁PIN" maxlength="4">
        <button onclick="submitData('add')">送信</button>
    </div>
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2RIgX8u2u7aaBRE85pUXNk0E0h_xcKMQoIODMds__fzDYJlcowdbALuwcj9a_lJQM/exec';
        async function submitData(action) {
            const data = {action: action, name: document.getElementById('name').value, pin: document.getElementById('pin').value};
            await fetch(GAS_URL, {method: 'POST', mode: 'no-cors', body: JSON.stringify(data)});
            alert("完了しました");
        }
    </script>
</body>
</html>
